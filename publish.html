<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>发布需求 · CampusLink</title>
<link rel="stylesheet" href="assets/css/main.css">
<style>
  .pick-modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .pm { position: relative; padding: 28px 24px; border-radius: 22px; background: #fff; border: 2px solid var(--line); cursor: pointer; transition: .3s var(--ease); text-align: left; overflow: hidden; }
  .pm:hover { transform: translateY(-4px); box-shadow: var(--sh-2); }
  .pm.on { border-color: var(--mc); box-shadow: 0 0 0 5px var(--mbg); }
  .pm .ic { width: 54px; height: 54px; border-radius: 16px; background: var(--mbg); color: var(--mc); display: grid; place-items: center; transition: .3s; }
  .pm.on .ic { background: var(--mc); color: #fff; }
  .pm .ic svg { width: 26px; height: 26px; }
  .pm h3 { font-size: 22px; font-weight: 900; margin: 18px 0 6px; }
  .pm .ex { margin-top: 14px; font-size: 12.5px; color: var(--muted); }
  .pm .radio { position: absolute; right: 20px; top: 20px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: #fff; transition: .3s; }
  .pm.on .radio { background: var(--mc); border-color: var(--mc); }
  .pm .radio svg { width: 14px; height: 14px; }
  .pm.teach { --mc: var(--teach); --mbg: var(--teach-bg); } .pm.help { --mc: var(--help); --mbg: var(--help-bg); } .pm.together { --mc: var(--together); --mbg: var(--together-bg); }
  .wiz-card { padding: 32px; }
  .wiz-foot { display: flex; justify-content: space-between; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
  .role-list { display: flex; flex-direction: column; gap: 8px; }
  .role-row { display: flex; gap: 10px; align-items: center; }
  .role-row .input { height: 40px; }
  .pane { animation: rise .5s var(--ease); }
  .counter { font-size: 12px; color: var(--muted-2); text-align: right; }
  .preview-wrap { display: grid; grid-template-columns: 360px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 900px) { .pick-modes, .preview-wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="page">
  <div class="container-sm">
    <div class="page-hero">
      <span class="eyebrow" data-ic="edit" id="pubEyebrow">发布需求</span>
      <h1 class="h1 mt-16" id="pubTitle">你想怎样<span class="hl">连接</span>？</h1>
      <div id="inviteBanner"></div>
    </div>
    <div class="stepper mb-24" id="stepper">
      <div class="step active" data-s="1"><span class="n">1</span>选择类型</div><div class="step-line"></div>
      <div class="step" data-s="2"><span class="n">2</span>填写详情</div><div class="step-line"></div>
      <div class="step" data-s="3"><span class="n">3</span>预览发布</div>
    </div>

    <div class="card wiz-card">
      <!-- STEP 1 -->
      <section class="pane" data-pane="1">
        <div class="pick-modes" id="pickModes"></div>
      </section>
      <!-- STEP 2 -->
      <form class="pane hidden" data-pane="2" id="pubForm" novalidate>
        <div class="col gap-20">
          <div class="field"><label>标题 <span class="req">*</span></label><input class="input" name="title" maxlength="50" placeholder=""><div class="counter"><span id="titleCnt">0</span>/50</div></div>
          <div class="field"><label>详细描述 <span class="req">*</span></label><textarea class="textarea" name="description" rows="6" style="min-height:160px"></textarea><span class="hint" id="descHint"></span></div>
          <div class="form-grid">
            <div class="field"><label>分类</label><select class="select" name="category"><option>设计</option><option>开发</option><option>编程</option><option>剪辑</option><option>竞赛</option><option>科研</option><option>工科</option><option>其他</option></select></div>
            <div class="field"><label>截止日期 <span class="req">*</span></label><input class="input" type="date" name="deadline"></div>
            <div class="field full"><label>技能标签 <span class="text-muted text-xs">回车添加，最多 6 个</span></label><div class="chip-input" data-chips="tags"><input placeholder="如 Figma、Python、剪辑"></div></div>
            <div class="field full"><label>合作方式</label><div class="choice-group">
              <label class="choice"><input type="radio" name="location" value="online" checked><span data-ic="video">线上</span></label>
              <label class="choice"><input type="radio" name="location" value="offline"><span data-ic="mapPin">线下</span></label>
              <label class="choice"><input type="radio" name="location" value="either"><span>都可以</span></label></div></div>
          </div>

          <!-- 教我做 -->
          <div class="form-grid" data-for="teach">
            <div class="field"><label>每次时长</label><select class="select" name="sessionMinutes"><option value="30">30 分钟</option><option value="45">45 分钟</option><option value="60" selected>60 分钟</option><option value="90">90 分钟</option></select></div>
            <div class="field"><label>预计次数</label><input class="input" type="number" name="sessions" min="1" value="1"></div>
          </div>
          <!-- 帮我做 -->
          <div class="field" data-for="help"><label>期望交付物 <span class="text-muted text-xs">回车添加</span></label><div class="chip-input" data-chips="deliverables"><input placeholder="如 .pptx 源文件、1080p 成片"></div></div>
          <!-- 一起做 -->
          <div class="col gap-20" data-for="together">
            <div class="form-grid">
              <div class="field"><label>比赛 / 项目名称 <span class="req">*</span></label><input class="input" name="event" placeholder="如：第十二届“互联网+”大赛"></div>
              <div class="field"><label>团队总人数</label><input class="input" type="number" name="teamSize" min="2" value="4"></div>
            </div>
            <div class="field"><label>角色 <span class="text-muted text-xs">勾选“已有”表示团队里已经有人负责</span></label>
              <div class="role-list" id="roleList"></div>
              <button type="button" class="btn btn-soft btn-sm mt-8" id="addRole" style="align-self:flex-start" data-ic="plus">添加角色</button></div>
          </div>

          <div class="field"><label>对参与者的要求 <span class="text-muted text-xs">回车添加</span></label><div class="chip-input" data-chips="requirements"><input placeholder="如 有相关作品、每周可投入 6 小时"></div></div>

          <div class="field"><label id="budgetLabel">预算</label>
            <div class="choice-group" id="budgetTypes"></div>
            <div class="form-grid mt-8" id="budgetAmt"><div class="field"><div class="input-group"><span data-ic="wallet"></span><input class="input" type="number" name="min" placeholder="最低"><span class="suffix">元</span></div></div><div class="field"><div class="input-group"><span data-ic="wallet"></span><input class="input" type="number" name="max" placeholder="最高（可选）"><span class="suffix">元</span></div></div></div>
          </div>
        </div>
      </form>
      <!-- STEP 3 -->
      <section class="pane hidden" data-pane="3"><div class="preview-wrap"><div id="previewCard"></div><div id="previewInfo"></div></div></section>

      <div class="wiz-foot">
        <button class="btn btn-ghost" id="prevBtn" data-ic="arrowLeft">上一步</button>
        <button class="btn btn-primary" id="nextBtn">下一步</button>
      </div>
    </div>
  </div>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(async function () {
  const U = CL.ui; const { $, $$, qs, icon, esc, MODES, toast } = U;
  const me = await U.mountHeader({});
  await U.requireLogin();
  U.hydrate();

  const editId = qs('edit');
  const inviteId = qs('invite');
  let editing = null;
  const st = { step: 1, mode: qs('mode') || '', chips: { tags: [], deliverables: [], requirements: [] }, roles: [{ name: '', filled: true }, { name: '', filled: false }] };

  const PLACE = {
    teach: ['如：求一位学长带我入门 Python 数据分析', '说说你想学什么、目前的基础、希望达成的目标，以及偏好的指导方式。'],
    help: ['如：毕设答辩 PPT 视觉优化（20 页左右）', '写清楚要做什么、交付标准、参考风格，越具体越容易找到合适的人。'],
    together: ['如：“互联网+”大赛 招募后端与运营', '介绍项目/比赛、团队现状、每个角色要做的事，以及获奖后的分配方式。'],
  };
  const BUDGET = {
    teach: [['per_session', '按次'], ['hourly', '按小时'], ['negotiable', '面议'], ['free', '免费 / 互助']],
    help: [['fixed', '一口价'], ['negotiable', '面议']],
    together: [['credit', '学分 / 综测加分'], ['free', '奖金平分 / 无报酬'], ['negotiable', '面议']],
  };

  $('#pickModes').innerHTML = Object.values(MODES).map((m) => `<button type="button" class="pm ${m.key}" data-m="${m.key}"><span class="radio">${icon('check')}</span><span class="ic">${icon(m.icon)}</span><h3>${m.name}</h3><p class="text-sm text-muted">${{ teach: '寻找某项能力的导师，或向别人请教具体问题', help: '有明确的任务要完成，外包给有能力的同学', together: '为比赛或项目寻找能力互补、同样有加分需求的伙伴' }[m.key]}</p><div class="ex">例：${{ teach: '作品集指导 / Python 入门 / 论文精读', help: '海报 / 剪辑 / PPT / 代码调试', together: '互联网+ / 挑战杯 / 数模 / 课程大作业' }[m.key]}</div></button>`).join('');
  $$('.pm').forEach((b) => (b.onclick = () => { st.mode = b.dataset.m; $$('.pm').forEach((x) => x.classList.toggle('on', x === b)); setTimeout(() => go(2), 260); }));

  if (inviteId) { const iu = await CL.api.users.get(inviteId).catch(() => null); if (iu) $('#inviteBanner').innerHTML = `<div class="row card-pad-sm mt-16" style="background:#fff;border-radius:14px;box-shadow:var(--sh-1)">${U.avatar(iu, 'sm')}<div class="grow text-sm">定向邀请 <b>${esc(iu.name)}</b>：发布后 TA 会收到通知，其他同学也仍可申请。</div></div>`; }

  // chips
  $$('[data-chips]').forEach((box) => {
    const key = box.dataset.chips, input = $('input', box);
    const render = () => { $$('.tag', box).forEach((t) => t.remove()); st.chips[key].forEach((v, i) => input.insertAdjacentHTML('beforebegin', `<span class="tag">${esc(v)}<button type="button" data-i="${i}">${icon('x')}</button></span>`)); $$('.tag button', box).forEach((b) => (b.onclick = () => { st.chips[key].splice(+b.dataset.i, 1); render(); })); };
    box._render = render;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); const v = input.value.trim(); if (v && !st.chips[key].includes(v) && (key !== 'tags' || st.chips[key].length < 6)) { st.chips[key].push(v); render(); } input.value = ''; } if (e.key === 'Backspace' && !input.value && st.chips[key].length) { st.chips[key].pop(); render(); } });
    box.addEventListener('click', () => input.focus());
  });
  function renderRoles() {
    $('#roleList').innerHTML = st.roles.map((r, i) => `<div class="role-row"><input class="input grow" data-ri="${i}" value="${esc(r.name)}" placeholder="角色名，如：后端开发"><label class="row gap-6 text-sm" style="white-space:nowrap"><span class="switch"><input type="checkbox" data-rf="${i}" ${r.filled ? 'checked' : ''}><i></i></span>已有</label><button type="button" class="icon-btn" data-rd="${i}" style="width:36px;height:36px">${icon('trash')}</button></div>`).join('');
    $$('[data-ri]').forEach((n) => (n.oninput = () => (st.roles[+n.dataset.ri].name = n.value)));
    $$('[data-rf]').forEach((n) => (n.onchange = () => (st.roles[+n.dataset.rf].filled = n.checked)));
    $$('[data-rd]').forEach((n) => (n.onclick = () => { st.roles.splice(+n.dataset.rd, 1); renderRoles(); }));
  }
  $('#addRole').onclick = () => { st.roles.push({ name: '', filled: false }); renderRoles(); };
  renderRoles();
  const f = $('#pubForm');
  f.elements.title.oninput = () => ($('#titleCnt').textContent = f.elements.title.value.length);

  function applyMode() {
    const m = st.mode;
    $$('[data-for]').forEach((n) => n.classList.toggle('hidden', n.dataset.for !== m));
    f.elements.title.placeholder = PLACE[m][0]; f.description.placeholder = PLACE[m][1];
    $('#budgetLabel').textContent = m === 'together' ? '回报方式' : '预算';
    const cur = $('input[name="btype"]:checked')?.value;
    $('#budgetTypes').innerHTML = BUDGET[m].map(([k, n], i) => `<label class="choice"><input type="radio" name="btype" value="${k}" ${(cur ? cur === k : !i) ? 'checked' : ''}><span>${n}</span></label>`).join('');
    if (!$('input[name="btype"]:checked')) $('input[name="btype"]').checked = true;
    const sync = () => $('#budgetAmt').classList.toggle('hidden', !['fixed', 'hourly', 'per_session'].includes($('input[name="btype"]:checked').value));
    $$('input[name="btype"]').forEach((r) => (r.onchange = sync)); sync();
    $('#pubEyebrow').innerHTML = `${icon(MODES[m].icon)}发布「${MODES[m].name}」`; $('#pubEyebrow').style.color = MODES[m].color;
  }

  function collect() {
    const d = Object.fromEntries(new FormData(f));
    const bt = d.btype;
    const out = { mode: st.mode, title: d.title.trim(), description: d.description.trim(), category: d.category, deadline: d.deadline ? new Date(d.deadline + 'T23:59:00').toISOString() : null, location: d.location, tags: st.chips.tags, requirements: st.chips.requirements,
      budget: ['fixed', 'hourly', 'per_session'].includes(bt) ? { type: bt, min: +d.min || 0, ...(d.max ? { max: +d.max } : {}) } : { type: bt } };
    if (st.mode === 'teach') Object.assign(out, { sessionMinutes: +d.sessionMinutes, sessions: +d.sessions || 1 });
    if (st.mode === 'help') out.deliverables = st.chips.deliverables;
    if (st.mode === 'together') Object.assign(out, { event: d.event.trim(), teamSize: +d.teamSize || null, roles: st.roles.filter((r) => r.name.trim()).map((r) => ({ name: r.name.trim(), filled: r.filled })) });
    if (inviteId) Object.assign(out, { invitedUserId: inviteId });
    return out;
  }
  function validate(d) {
    const errs = [];
    $$('.invalid', f).forEach((n) => n.classList.remove('invalid'));
    if (d.title.length < 5) { errs.push('标题至少 5 个字'); f.elements.title.classList.add('invalid'); }
    if (d.description.length < 15) { errs.push('描述至少 15 个字'); f.description.classList.add('invalid'); }
    if (!d.deadline) { errs.push('请选择截止日期'); f.deadline.classList.add('invalid'); }
    if (d.mode === 'together' && !d.event) { errs.push('请填写比赛/项目名称'); f.event.classList.add('invalid'); }
    if (d.mode === 'together' && !d.roles.some((r) => !r.filled)) errs.push('至少需要一个待招募的角色');
    if (['fixed', 'hourly', 'per_session'].includes(d.budget.type) && !d.budget.min) errs.push('请填写金额');
    if (errs.length) toast(errs[0], 'error');
    return !errs.length;
  }

  function go(n) {
    if (n === 2 && !st.mode) return toast('请先选择一种类型', 'info');
    if (n === 3) { const d = collect(); if (!validate(d)) return; renderPreview(d); }
    st.step = n;
    if (n === 2) applyMode();
    $$('.pane').forEach((p) => p.classList.toggle('hidden', +p.dataset.pane !== n));
    $$('#stepper .step').forEach((s) => { const k = +s.dataset.s; s.classList.toggle('active', k === n); s.classList.toggle('done', k < n); $('.n', s).innerHTML = k < n ? icon('check') : k; });
    $$('#stepper .step-line').forEach((l, i) => l.classList.toggle('done', i + 1 < n));
    $('#prevBtn').classList.toggle('hidden', n === 1);
    $('#nextBtn').classList.toggle('hidden', n === 1);
    $('#nextBtn').innerHTML = n === 3 ? `${icon('send')}${editing ? '保存修改' : '确认发布'}` : `下一步${icon('arrowRight')}`;
    $('#pubTitle').innerHTML = ['', '你想怎样<span class="hl">连接</span>？', '把需求<span class="hl">写清楚</span>', '最后<span class="hl">确认</span>一下'][n];
    scrollTo({ top: 0, behavior: 'smooth' });
  }
  function renderPreview(d) {
    $('#previewCard').innerHTML = `<div class="text-xs text-muted mb-8">在广场中的展示效果</div>` + U.postCard({ ...d, id: 'preview', author: me, createdAt: new Date().toISOString(), applicantCount: 0, status: 'open', summary: d.description.slice(0, 60) }).replace(/onclick="[^"]*"/, '');
    $('#previewInfo').innerHTML = `<h3 class="h3">${esc(d.title)}</h3><p class="desc-body text-muted mt-12" style="white-space:pre-line">${esc(d.description)}</p>
      <dl class="kv mt-24"><dt>类型</dt><dd>${MODES[d.mode].name}</dd><dt>截止</dt><dd>${U.fmtDate(d.deadline)}</dd><dt>${d.mode === 'together' ? '回报' : '预算'}</dt><dd>${U.fmtBudget(d.budget)}</dd>
      ${d.roles ? `<dt>招募角色</dt><dd>${d.roles.filter((r) => !r.filled).map((r) => esc(r.name)).join('、')}</dd>` : ''}
      ${d.deliverables?.length ? `<dt>交付物</dt><dd>${d.deliverables.map(esc).join('、')}</dd>` : ''}
      ${d.requirements?.length ? `<dt>要求</dt><dd>${d.requirements.map(esc).join('；')}</dd>` : ''}</dl>`;
  }
  $('#prevBtn').onclick = () => go(st.step - 1);
  $('#nextBtn').onclick = async (e) => {
    if (st.step < 3) return go(st.step + 1);
    const d = collect(); e.currentTarget.disabled = true;
    try { const p = editing ? await CL.api.posts.update(editing.id, d) : await CL.api.posts.create(d); toast(editing ? '已保存' : '发布成功！'); setTimeout(() => (location.href = 'post.html?id=' + p.id), 500); }
    catch (err) { toast(err.message, 'error'); e.currentTarget.disabled = false; }
  };

  // 编辑模式：回填
  if (editId) {
    editing = await CL.api.posts.get(editId);
    st.mode = editing.mode; f.elements.title.value = editing.title; f.description.value = editing.description; f.category.value = editing.category || '其他';
    if (editing.deadline) f.deadline.value = editing.deadline.slice(0, 10);
    $$('input[name="location"]').forEach((r) => (r.checked = r.value === editing.location));
    ['tags', 'deliverables', 'requirements'].forEach((k) => { st.chips[k] = [...(editing[k] || [])]; $(`[data-chips="${k}"]`)._render(); });
    if (editing.roles) { st.roles = editing.roles.map((r) => ({ ...r })); renderRoles(); }
    if (editing.event) f.event.value = editing.event; if (editing.teamSize) f.teamSize.value = editing.teamSize;
    if (editing.sessionMinutes) f.sessionMinutes.value = editing.sessionMinutes; if (editing.sessions) f.sessions.value = editing.sessions;
    applyMode();
    $$('input[name="btype"]').forEach((r) => (r.checked = r.value === editing.budget?.type)); f.min.value = editing.budget?.min || ''; f.max.value = editing.budget?.max || '';
    applyMode(); $$('.pm').forEach((x) => x.classList.toggle('on', x.dataset.m === st.mode));
    go(2);
  } else if (st.mode) { $$('.pm').forEach((x) => x.classList.toggle('on', x.dataset.m === st.mode)); go(2); }
  else go(1);
  const dflt = new Date(Date.now() + 7 * 864e5); if (!f.deadline.value) f.deadline.value = dflt.toISOString().slice(0, 10);
})();
</script>
</body>
</html>
